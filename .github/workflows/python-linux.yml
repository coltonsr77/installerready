name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install requirements
      run: pip install -r requirements.txt

    - name: Run tests
      run: |
        pytest -q

    - name: Install PyInstaller
      run: pip install pyinstaller

    - name: Build InstallerReady
      run: pyinstaller installerready.spec

    - name: Publish Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: '${{ matrix.os }}-GUI'
        path: dist
